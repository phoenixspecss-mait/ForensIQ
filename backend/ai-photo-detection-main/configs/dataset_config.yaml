# Dataset Configuration & Multi-Tier Paths
project_name: "DeepPixel-Forensics"
random_seed: 42

# Multi-Tier Directory Layout
data_paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  extracted_features_dir: "data/extracted_features"
  robustness_dir: "data/robustness_benchmarks"

# Track A: Synthetic Media Detection Datasets
track_a:
  train_generators:
    - "biggan"
    - "sd_v14"
  seen_family_generators:
    - "sd_v15"
  unseen_generators:
    - "dalle_3"
    - "midjourney_v5"
    - "firefly"
    - "sd_xl"
  real_sources:
    - "imagenet_val"
    - "coco_val"
  split_ratios:
    train: 0.70
    val: 0.15
    test_in_dist: 0.15

# Track B: Image Manipulation Detection & Localization
track_b:
  manipulation_types:
    - "splicing"
    - "copy_move"
    - "inpainting"
  source_datasets:
    train_val:
      - "defacto"
      - "casia_2"
    cross_dataset_eval:
      - "coverage"
  split_ratios:
    train: 0.70
    val: 0.15
    test_in_dist: 0.15

# Track C: Standalone PRNU Camera Sensor Forensics
track_c:
  dataset: "raise_1k"
  camera_models:
    - "nikon_d7000"
    - "nikon_d90"
    - "nikon_d40"
  reference_images_per_camera: 50
  query_test_images_per_camera: 50

# Data Sanitization & Anti-Leakage Rules
sanitization:
  phash_hamming_threshold: 5
  drop_exact_duplicates: true
  strip_outer_border_px: 16
  target_resolution: [256, 256]
  interpolation: "bicubic"
