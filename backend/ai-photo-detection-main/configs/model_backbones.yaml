# Pretrained Vision Backbone Shootout Configurations (EXP001)

backbones:
  convnext_tiny:
    architecture: "convnext_tiny"
    pretrained: true
    in_channels: 3
    feature_dim: 768
    drop_rate: 0.1
    drop_path_rate: 0.1
    stages_out_channels: [96, 192, 384, 768]

  efficientnet_b0:
    architecture: "efficientnet_b0"
    pretrained: true
    in_channels: 3
    feature_dim: 1280
    drop_rate: 0.2
    drop_path_rate: 0.1
    stages_out_channels: [24, 40, 112, 1280]

  swin_tiny:
    architecture: "swin_tiny_patch4_window7_224"
    pretrained: true
    in_channels: 3
    feature_dim: 768
    drop_rate: 0.1
    drop_path_rate: 0.1
    stages_out_channels: [96, 192, 384, 768]

# Common Backbone Settings
input_resolution: [3, 256, 256]
normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
