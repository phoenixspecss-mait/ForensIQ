# Low-Level Pixel Forensics Feature Engineering Configuration

# 2D Spatial Forensics Stream
spatial_stream:
  ela:
    quality: 90
    scale_factor: 10.0
    color_space: "RGB"
  srm:
    kernels:
      - "edge"
      - "square"
      - "point"
    clip_range: [-255, 255]
  output_tensor_shape: [4, 256, 256] # 3-ch SRM + 1-ch ELA

# 1D Statistical Forensics Stream
statistical_stream:
  fft_2d:
    radial_bins: 32
    apply_log_scale: true
    normalize_radial_profile: true
  dct:
    block_size: 8
    num_histogram_bins: 16
    quantization_matrix: "standard_jpeg"
  color_moments:
    color_spaces:
      - "RGB"
      - "Lab"
      - "HSV"
    moments:
      - "mean"
      - "std"
      - "skewness"
      - "kurtosis"
    compute_channel_covariance: true
  texture_edge:
    glcm:
      distances: [1, 2]
      angles: [0, 0.785, 1.57, 2.356] # 0, 45, 90, 135 degrees
      properties: ["contrast", "dissimilarity", "homogeneity", "energy", "correlation"]
    lbp:
      points: 8
      radius: 1
      method: "uniform"
    gradient:
      operator: "sobel"
      compute_kurtosis: true
      compute_patch_entropy: true
      patch_size: 16

# Standardized Statistical Feature Vector Dimension
total_statistical_features: 128
